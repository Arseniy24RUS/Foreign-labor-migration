<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура</title>
  <desc id="desc">Исходные данные проходят предобработку и модель квоты/дефицита, затем публикуются в статическом дашборде.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b5ed7"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#08285f" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="560" fill="#f4f8fd"/>
  <g opacity="0.58">
    <path d="M0 118 H1200" stroke="#dbeafe"/>
    <path d="M0 502 H1200" stroke="#dbeafe"/>
  </g>
  <text x="600.0" y="58" text-anchor="middle" font-size="34" font-weight="800" fill="#061b4a"><tspan x="600.0" dy="0">Архитектура</tspan></text>
  <text x="600.0" y="95" text-anchor="middle" font-size="18" font-weight="400" fill="#47618d"><tspan x="600.0" dy="0">Исходные данные проходят предобработку и модель квоты/дефицита, затем публикуются в статическом дашборде.</tspan></text>
  <g filter="url(#shadow)">

  <rect x="54" y="185" width="220" height="230" rx="16" fill="#ffffff" stroke="#cfe0f5" stroke-width="2"/>
  <rect x="54" y="185" width="220" height="9" rx="4" fill="#0b5ed7"/>
  <text x="164.0" y="230" text-anchor="middle" font-size="24" font-weight="700" fill="#061b4a"><tspan x="164.0" dy="0">Исходные данные</tspan></text>
  <text x="164.0" y="271" text-anchor="middle" font-size="17" font-weight="400" fill="#47618d"><tspan x="164.0" dy="0">население</tspan><tspan x="164.0" dy="23">занятость</tspan><tspan x="164.0" dy="23">ВРП и производительность</tspan><tspan x="164.0" dy="23">региональные классификаторы</tspan></text>

<path d="M274 300 L312 300" stroke="#0b5ed7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="330" y="185" width="220" height="230" rx="16" fill="#ffffff" stroke="#cfe0f5" stroke-width="2"/>
  <rect x="330" y="185" width="220" height="9" rx="4" fill="#18a999"/>
  <text x="440.0" y="230" text-anchor="middle" font-size="24" font-weight="700" fill="#061b4a"><tspan x="440.0" dy="0">Предобработка</tspan></text>
  <text x="440.0" y="271" text-anchor="middle" font-size="17" font-weight="400" fill="#47618d"><tspan x="440.0" dy="0">проверка схем</tspan><tspan x="440.0" dy="23">кроссволки</tspan><tspan x="440.0" dy="23">компактные CSV/JSON</tspan><tspan x="440.0" dy="23">слои для дашборда</tspan></text>

<path d="M550 300 L588 300" stroke="#0b5ed7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="606" y="185" width="220" height="230" rx="16" fill="#ffffff" stroke="#cfe0f5" stroke-width="2"/>
  <rect x="606" y="185" width="220" height="9" rx="4" fill="#f59e0b"/>
  <text x="716.0" y="230" text-anchor="middle" font-size="24" font-weight="700" fill="#061b4a"><tspan x="716.0" dy="0">Модель квоты / дефицита</tspan></text>
  <text x="716.0" y="271" text-anchor="middle" font-size="17" font-weight="400" fill="#47618d"><tspan x="716.0" dy="0">рекомендуемая квота</tspan><tspan x="716.0" dy="23">дефицит на конец года</tspan><tspan x="716.0" dy="23">распределение резерва</tspan><tspan x="716.0" dy="23">отраслевой спрос</tspan></text>

<path d="M826 300 L864 300" stroke="#0b5ed7" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="882" y="185" width="220" height="230" rx="16" fill="#ffffff" stroke="#cfe0f5" stroke-width="2"/>
  <rect x="882" y="185" width="220" height="9" rx="4" fill="#385070"/>
  <text x="992.0" y="230" text-anchor="middle" font-size="24" font-weight="700" fill="#061b4a"><tspan x="992.0" dy="0">Статический дашборд</tspan></text>
  <text x="992.0" y="271" text-anchor="middle" font-size="17" font-weight="400" fill="#47618d"><tspan x="992.0" dy="0">GitHub Pages</tspan><tspan x="992.0" dy="23">карта, рейтинги, атлас</tspan><tspan x="992.0" dy="23">таблица детализации</tspan><tspan x="992.0" dy="23">региональный паспорт</tspan></text>

<text x="600" y="470" text-anchor="middle" font-size="19" font-weight="700" fill="#0b5ed7"><tspan x="600" dy="0">docs/data + docs/assets → воспроизводимая статическая публикация</tspan></text>
  </g>
</svg>
